name: Build XOSINFO Binaries

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Prevents GitHub from cancelling all parallel jobs if one fails
      fail-fast: false 
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux_x64
            output_name: xosinfo-linux-x64
            sys-env: posix
          - os: windows-latest
            arch: win64
            output_name: xosinfo-win64.exe
            sys-env: mingw64
          - os: windows-latest
            arch: win32
            output_name: xosinfo-win32.exe
            sys-env: mingw32
          - os: macos-latest
            arch: macos_universal
            output_name: xosinfo-macos
            sys-env: posix

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSYS2 Toolchain (Windows)
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys-env }}
        update: true
        install: >-
          git
          make
          ${{ matrix.arch == 'win32' && 'mingw-w64-i686-gcc' || 'mingw-w64-x86_64-gcc' }}

    - name: Compile Source (Windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        # In MSYS2 environments, compilers map to specific target prefixes
        if [ "${{ matrix.arch }}" = "win32" ]; then
          i686-w64-mingw32-g++ src/main.cpp -o ${{ matrix.output_name }} -O3 -liphlpapi -lws2_32
        else
          x86_64-w64-mingw32-g++ src/main.cpp -o ${{ matrix.output_name }} -O3 -liphlpapi -lws2_32
        fi

    - name: Compile Source (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        g++ src/main.cpp -o ${{ matrix.output_name }} -O3

    - name: Compile Source (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        clang++ src/main.cpp -o ${{ matrix.output_name }} -O3 -arch x86_64 -arch arm64
      
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.output_name }}
        path: ${{ matrix.output_name }}

  generate_stats:
    name: Generate and Push stats.json
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Create JSON
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOL_DATE=$(date -u -d "+1 year" +"%Y-%m-%dT%H:%M:%SZ")
          VERSION="1.0.${{ github.run_number }}"
          
          cat <<EOF > stats.json
          {
            "version": "$VERSION",
            "build_date": "$BUILD_DATE",
            "eol": "$EOL_DATE",
            "downloads": [
              {
                "os": "Linux",
                "arch": "linux_x64",
                "filename": "xosinfo-linux-x64"
              },
              {
                "os": "Windows",
                "arch": "win64",
                "filename": "xosinfo-win64.exe"
              },
              {
                "os": "Windows",
                "arch": "win32",
                "filename": "xosinfo-win32.exe"
              },
              {
                "os": "macOS",
                "arch": "macos_universal",
                "filename": "xosinfo-macos"
              }
            ]
          }
          EOF

      - name: Commit and Push stats.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add stats.json
          git commit -m "chore: update stats.json for homepage [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Upload stats.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: stats.json
          path: stats.json
