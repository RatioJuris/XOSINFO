name: Build XOSINFO Binaries

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Prevents GitHub from cancelling all jobs if one fails
      fail-fast: false 
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux_x64
            output_name: xosinfo-linux-x64
            compiler: g++
            flags: "-O3"
          - os: windows-latest
            arch: win64
            output_name: xosinfo-win64.exe
            compiler: g++
            flags: "-O3 -liphlpapi -lws2_32"
          # Note: Standard GitHub windows-latest runners may not have 32-bit C++ headers installed by default. 
          # If this win32 job fails, you can safely remove it from the matrix.
          - os: windows-latest
            arch: win32
            output_name: xosinfo-win32.exe
            compiler: g++
            flags: "-m32 -O3 -liphlpapi -lws2_32"
          - os: macos-latest
            arch: macos_universal
            output_name: xosinfo-macos
            compiler: clang++
            # Compiles a Fat Binary containing both Intel (x86_64) and Apple Silicon (arm64) instructions
            flags: "-O3 -arch x86_64 -arch arm64"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Source
      run: |
        # Fixed argument order: flags must come AFTER the source file for the linker
        ${{ matrix.compiler }} src/main.cpp -o ${{ matrix.output_name }} ${{ matrix.flags }}
      
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.output_name }}
        path: ${{ matrix.output_name }}

  generate_stats:
    name: Generate and Push stats.json
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Create JSON
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOL_DATE=$(date -u -d "+1 year" +"%Y-%m-%dT%H:%M:%SZ")
          VERSION="1.0.${{ github.run_number }}"
          
          cat <<EOF > stats.json
          {
            "version": "$VERSION",
            "build_date": "$BUILD_DATE",
            "eol": "$EOL_DATE",
            "downloads": [
              {
                "os": "Linux",
                "arch": "linux_x64",
                "filename": "xosinfo-linux-x64"
              },
              {
                "os": "Windows",
                "arch": "win64",
                "filename": "xosinfo-win64.exe"
              },
              {
                "os": "Windows",
                "arch": "win32",
                "filename": "xosinfo-win32.exe"
              },
              {
                "os": "macOS",
                "arch": "macos_universal",
                "filename": "xosinfo-macos"
              }
            ]
          }
          EOF

      - name: Commit and Push stats.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add stats.json
          git commit -m "chore: update stats.json for homepage [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Upload stats.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: stats.json
          path: stats.json
