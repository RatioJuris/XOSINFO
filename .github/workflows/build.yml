name: Build XOSINFO Binaries

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Explicitly grant read and write permissions to the GITHUB_TOKEN
permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux_x64
            output_name: xosinfo-linux-x64
            compiler: g++
            flags: "-O3"
          - os: windows-latest
            arch: win64
            output_name: xosinfo-win64.exe
            compiler: g++
            flags: "-O3 -liphlpapi"
          - os: windows-latest
            arch: win32
            output_name: xosinfo-win32.exe
            compiler: g++
            flags: "-m32 -O3 -liphlpapi"
          - os: macos-latest
            arch: macos_universal
            output_name: xosinfo-macos
            compiler: clang++
            flags: "-O3"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Source
      run: |
        ${{ matrix.compiler }} ${{ matrix.flags }} src/main.cpp -o ${{ matrix.output_name }}
      
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.output_name }}
        path: ${{ matrix.output_name }}

  generate_stats:
    name: Generate and Push stats.json
    needs: build
    runs-on: ubuntu-latest
    # Only run the push step if it's on the main branch (prevents pushing during PRs)
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required to fetch the full history so we can push back
          fetch-depth: 0 

      - name: Create JSON
        run: |
          # Generate timestamps and version
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOL_DATE=$(date -u -d "+1 year" +"%Y-%m-%dT%H:%M:%SZ")
          VERSION="1.0.${{ github.run_number }}"
          
          # Write the JSON array for the homepage to parse
          cat <<EOF > stats.json
          {
            "version": "$VERSION",
            "build_date": "$BUILD_DATE",
            "eol": "$EOL_DATE",
            "downloads": [
              {
                "os": "Linux",
                "arch": "linux_x64",
                "filename": "xosinfo-linux-x64"
              },
              {
                "os": "Windows",
                "arch": "win64",
                "filename": "xosinfo-win64.exe"
              },
              {
                "os": "Windows",
                "arch": "win32",
                "filename": "xosinfo-win32.exe"
              },
              {
                "os": "macOS",
                "arch": "macos_universal",
                "filename": "xosinfo-macos"
              }
            ]
          }
          EOF

      - name: Commit and Push stats.json
        run: |
          # Configure git as the GitHub Actions bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Add, commit, and push the stats.json file
          git add stats.json
          # [skip ci] prevents this commit from triggering another build loop
          git commit -m "chore: update stats.json for homepage [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Upload stats.json as artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: stats.json
          path: stats.json
