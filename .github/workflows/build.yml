name: Build and Release XOSINFO Binaries

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*.*"
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux_x64
            output_name: xosinfo-linux-x64
            sys-env: posix
          - os: windows-latest
            arch: win64
            output_name: xosinfo-win64.exe
            sys-env: mingw64
          - os: macos-latest
            arch: macos_universal
            output_name: xosinfo-macos
            sys-env: posix

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSYS2 Toolchain (Windows)
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys-env }}
        update: true
        install: >-
          git
          make
          mingw-w64-x86_64-gcc

    - name: Create Build Directory (All Platforms)
      run: mkdir -p build

    - name: Compile Source (Windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        x86_64-w64-mingw32-g++ src/main.cpp -o build/${{ matrix.output_name }} -O3 -static -liphlpapi -lws2_32

    - name: Compile Source (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        g++ src/main.cpp -o build/${{ matrix.output_name }} -O3

    - name: Compile Source (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        clang++ src/main.cpp -o build/${{ matrix.output_name }} -O3 -arch x86_64 -arch arm64
      
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.output_name }}
        path: build/${{ matrix.output_name }}

  generate_stats_and_release:
    name: Generate Stats and Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Create Build Directory
        run: mkdir -p build

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: xosinfo-linux-x64
          path: build

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: xosinfo-win64.exe
          path: build

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: xosinfo-macos
          path: build

      - name: Create JSON
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOL_DATE=$(date -u -d "+1 year" +"%Y-%m-%dT%H:%M:%SZ")
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="1.0.${{ github.run_number }}"
          fi
          
          cat <<EOF > stats.json
          {
            "version": "$VERSION",
            "build_date": "$BUILD_DATE",
            "eol": "$EOL_DATE",
            "downloads": [
              {
                "os": "Linux",
                "arch": "linux_x64",
                "filename": "xosinfo-linux-x64",
                "path": "build/xosinfo-linux-x64"
              },
              {
                "os": "Windows",
                "arch": "win64",
                "filename": "xosinfo-win64.exe",
                "path": "build/xosinfo-win64.exe"
              },
              {
                "os": "macOS",
                "arch": "macos_universal",
                "filename": "xosinfo-macos",
                "path": "build/xosinfo-macos"
              }
            ]
          }
          EOF

      - name: Commit and Push build files and stats.json
        run: |
          git config --global user.name "RatioJurisBeeBot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -f build/xosinfo-linux-x64 build/xosinfo-win64.exe build/xosinfo-macos
          git add stats.json
          
          git commit -m "chore: update build binaries and stats.json [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/xosinfo-linux-x64
            build/xosinfo-win64.exe
            build/xosinfo-macos
            stats.json
          name: XOSINFO ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## XOSINFO System Integrity Capture Tool - Release ${{ github.ref_name }}
            
            Automated production build for forensic validation state metrics capture.
            
            ### SHA256 Verification Checksums
            - **Linux x64**: `build/xosinfo-linux-x64`
            - **Windows x64**: `build/xosinfo-win64.exe`
            - **macOS Universal**: `build/xosinfo-macos`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
